<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agrajay Agam Classes</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; line-height: 1.6; background-color: #f4f4f9; }
        .container { max-width: 800px; margin: auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #333; }
        .admin-panel { display: none; background: #eef; padding: 15px; margin-bottom: 20px; border-radius: 5px; border: 1px solid #ccd; }
        input, textarea, button { width: 100%; margin-bottom: 10px; padding: 10px; box-sizing: border-box; }
        button { background-color: #007bff; color: white; border: none; cursor: pointer; border-radius: 4px; font-weight: bold; }
        button:hover { background-color: #0056b3; }
        .article { background: #fff; padding: 15px; border-bottom: 1px solid #ddd; margin-bottom: 15px; }
        .article h3 { margin-top: 0; color: #007bff; }
    </style>
    <!-- Firebase SDK Scripts -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

<div class="container">
    <h1>Agrajay Agam Classes</h1>

    <!-- Admin Panel -->
    <div id="adminPanel" class="admin-panel">
        <h3>Admin Panel - Post New Article</h3>
        <input type="text" id="title" placeholder="Article Title">
        <textarea id="content" rows="5" placeholder="Article Content"></textarea>
        <button onclick="postArticle()">Publish Article</button>
    </div>

    <!-- Articles List -->
    <h2>Latest Articles</h2>
    <div id="articles">Loading articles...</div>
</div>

<script>
    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyCFcPEAFCOB_0U-H__I0rZ7v2xsmNCkHhI",
      authDomain: "agrajay-agam-classes.firebaseapp.com",
      databaseURL: "https://agrajay-agam-classes-default-rtdb.firebaseio.com",
      projectId: "agrajay-agam-classes",
      storageBucket: "agrajay-agam-classes.firebasestorage.app",
      messagingSenderId: "205657019628",
      appId: "1:205657019628:web:fb83a3b728b351d62a81c9"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // Check for Admin Access
    const urlParams = new URLSearchParams(window.location.search);
    const isAdmin = urlParams.get('admin');

    if (isAdmin === 'true') {
        let pin = prompt("Enter Admin PIN:");
        if (pin === "1234") {
            document.getElementById('adminPanel').style.display = 'block';
        } else {
            alert("Incorrect PIN!");
        }
    }

    // Shortcut: Ctrl + Shift + A to trigger Admin Mode
    document.addEventListener('keydown', function(e) {
        if (e.ctrlKey && e.shiftKey && e.key === 'A') {
            let pin = prompt("Enter Admin PIN:");
            if (pin === "1234") {
                document.getElementById('adminPanel').style.display = 'block';
            } else {
                alert("Incorrect PIN!");
            }
        }
    });

    // Function to Post Article to Firebase
    function postArticle() {
        const title = document.getElementById('title').value;
        const content = document.getElementById('content').value;

        if (title && content) {
            const newArticleRef = database.ref('articles').push();
            newArticleRef.set({
                title: title,
                content: content,
                date: new Date().toLocaleDateString()
            }, (error) => {
                if (error) {
                    alert("Error posting article: " + error.message);
                } else {
                    alert("Article published successfully!");
                    document.getElementById('title').value = '';
                    document.getElementById('content').value = '';
                }
            });
        } else {
            alert("Please fill in both title and content!");
        }
    }

    // Fetch Articles from Firebase in Realtime
    database.ref('articles').on('value', (snapshot) => {
        const articlesDiv = document.getElementById('articles');
        articlesDiv.innerHTML = '';
        const data = snapshot.val();

        if (data) {
            Object.keys(data).reverse().forEach(key => {
                const article = data[key];
                const articleElement = document.createElement('div');
                articleElement.className = 'article';
                articleElement.innerHTML = `
                    <h3>${article.title}</h3>
                    <small>Published on: ${article.date}</small>
                    <p>${article.content}</p>
                `;
                articlesDiv.appendChild(articleElement);
            });
        } else {
            articlesDiv.innerHTML = '<p>No articles posted yet.</p>';
        }
    });
</script>

</body>
</html>
