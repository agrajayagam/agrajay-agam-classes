<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agrajay Agam Classes</title>
    <style>
        :root {
            --primary-green: #2e7d32;
            --accent-green: #4caf50;
            --light-green: #e8f5e9;
            --primary-yellow: #fbc02d;
            --light-yellow: #fffde7;
            --dark-text: #1b5e20;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 15px; 
            background-color: var(--light-yellow); 
            color: #333; 
        }

        .container { 
            max-width: 850px; 
            margin: auto; 
            background: #ffffff; 
            padding: 25px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(46, 125, 50, 0.15); 
            border-top: 6px solid var(--primary-green);
        }

        /* Header Section */
        .header-box { text-align: center; margin-bottom: 20px; }
        h1 { color: var(--primary-green); margin-bottom: 5px; font-size: 28px; cursor: pointer; user-select: none; }
        .subtitle { color: #555; margin-bottom: 15px; font-size: 15px; }

        .top-buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .yt-btn { 
            display: inline-flex; 
            align-items: center; 
            gap: 8px; 
            background-color: #d32f2f; 
            color: white; 
            padding: 10px 20px; 
            text-decoration: none; 
            border-radius: 25px; 
            font-weight: bold; 
            font-size: 14px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.2); 
        }

        .follow-btn {
            background-color: var(--primary-yellow);
            color: #333;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .follow-btn:hover { background-color: #fdd835; }

        /* Category Menu Bar */
        .category-menu {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 10px 0;
            margin-bottom: 20px;
            border-top: 1px solid #c8e6c9;
            border-bottom: 1px solid #c8e6c9;
            scrollbar-width: thin;
        }
        .menu-btn {
            white-space: nowrap;
            background: var(--light-green);
            color: var(--dark-text);
            border: 1px solid #a5d6a7;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            width: auto;
            margin-bottom: 0;
        }
        .menu-btn.active {
            background: var(--primary-green);
            color: white;
            border-color: var(--primary-green);
        }

        /* Admin Panel */
        .admin-panel { 
            display: none; 
            background: var(--light-green); 
            padding: 20px; 
            margin-bottom: 25px; 
            border-radius: 8px; 
            border: 2px solid var(--accent-green); 
        }
        .admin-panel h3 { margin-top: 0; color: var(--primary-green); }
        
        input, select, textarea, button { 
            width: 100%; 
            margin-bottom: 12px; 
            padding: 12px; 
            box-sizing: border-box; 
            border: 1px solid #ccc; 
            border-radius: 6px; 
            font-size: 14px; 
        }

        .btn-green { 
            background-color: var(--primary-green); 
            color: white; 
            border: none; 
            cursor: pointer; 
            font-weight: bold; 
            border-radius: 6px;
        }
        .btn-green:hover { background-color: #1b5e20; }

        /* Articles Styling */
        .article { 
            background: #fff; 
            padding: 20px; 
            border: 1px solid #c8e6c9; 
            border-radius: 8px; 
            margin-bottom: 20px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
            position: relative;
        }
        .article h3 { margin-top: 0; color: var(--primary-green); font-size: 20px; margin-bottom: 8px; }
        
        .category-badge { 
            display: inline-block; 
            background: var(--primary-yellow); 
            color: #333; 
            padding: 4px 12px; 
            border-radius: 12px; 
            font-size: 12px; 
            font-weight: bold; 
            margin-bottom: 10px; 
        }

        .article-date { font-size: 12px; color: #777; margin-bottom: 15px; }
        .article-content { white-space: pre-wrap; line-height: 1.7; font-size: 15px; color: #333; }

        /* Admin Controls for Articles */
        .admin-controls {
            display: none;
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px dashed #ccc;
            gap: 10px;
        }
        .btn-edit { background: #1976d2; color: white; width: auto; padding: 6px 15px; font-size: 12px; border: none; border-radius: 4px; cursor: pointer; }
        .btn-delete { background: #d32f2f; color: white; width: auto; padding: 6px 15px; font-size: 12px; border: none; border-radius: 4px; cursor: pointer; }

        /* User Actions Section */
        .interaction-box { border-top: 1px solid #e0e0e0; margin-top: 15px; padding-top: 15px; }
        .action-bar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px; }
        
        .action-btn { 
            width: auto; 
            background: var(--light-green); 
            color: var(--dark-text); 
            border: 1px solid #a5d6a7; 
            padding: 8px 16px; 
            border-radius: 20px; 
            cursor: pointer; 
            display: inline-flex; 
            align-items: center; 
            gap: 6px; 
            font-size: 13px; 
            font-weight: 600;
        }
        .action-btn:hover { background: #c8e6c9; }

        /* Comments Styling */
        .comments-section { background: var(--light-yellow); padding: 12px; border-radius: 8px; border: 1px solid #fff59d; }
        .comment-item { border-bottom: 1px solid #fff099; padding: 8px 0; font-size: 13px; }
        .comment-item:last-child { border-bottom: none; }
        .comment-input-group { display: flex; gap: 8px; margin-top: 10px; }
        .comment-input-group input { margin-bottom: 0; background: #fff; }
        .comment-input-group button { width: auto; padding: 8px 15px; font-size: 13px; margin-bottom: 0; }
    </style>
    
    <!-- Firebase SDK Scripts -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

<div class="container">
    <div class="header-box">
        <h1 id="siteHeading" title="Triple tap to open Admin Mode">Agrajay Agam Classes</h1>
        <div class="subtitle">Learn English, Spoken Skills & Daily Practice Material</div>
        
        <div class="top-buttons">
            <a href="https://www.youtube.com/@agrajayagamclasses" target="_blank" class="yt-btn">
                ▶ YouTube Channel
            </a>
            <button class="follow-btn" onclick="toggleFollow()">
                <span id="followIcon">➕</span> <span id="followText">Follow</span> (<span id="followerCount">0</span>)
            </button>
        </div>
    </div>

    <!-- Scrollable Menu Tabs -->
    <div class="category-menu">
        <button class="menu-btn active" onclick="filterArticles('All', this)">All</button>
        <button class="menu-btn" onclick="filterArticles('English Speaking Script', this)">English Speaking Script</button>
        <button class="menu-btn" onclick="filterArticles('Motivation', this)">Motivation</button>
        <button class="menu-btn" onclick="filterArticles('Daily Use English Sentences', this)">Daily Use Sentences</button>
        <button class="menu-btn" onclick="filterArticles('Spoken Friendly Vocabulary', this)">Vocabulary</button>
        <button class="menu-btn" onclick="filterArticles('Conversation', this)">Conversation</button>
        <button class="menu-btn" onclick="filterArticles('Translation Structures', this)">Translation</button>
    </div>

    <!-- Admin Panel (Only visible to admin) -->
    <div id="adminPanel" class="admin-panel">
        <h3 id="panelTitle">Admin Panel - Post New Content</h3>
        <input type="hidden" id="editArticleId">
        <input type="text" id="title" placeholder="Article Title">
        
        <select id="category">
            <option value="English Speaking Script">English Speaking Script</option>
            <option value="Motivation">Motivation</option>
            <option value="Daily Use English Sentences">Daily Use English Sentences</option>
            <option value="Spoken Friendly Vocabulary">Spoken Friendly Vocabulary</option>
            <option value="Conversation">Conversation</option>
            <option value="Translation Structures">Translation Structures</option>
        </select>
        
        <textarea id="content" rows="6" placeholder="Write content here..."></textarea>
        <button class="btn-green" onclick="postArticle()" id="submitBtn">Publish Content</button>
    </div>

    <!-- Articles List -->
    <h2 style="color: var(--primary-green);" id="sectionHeading">Latest Content</h2>
    <div id="articles">Loading content...</div>
</div>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyCFcPEAFCOB_0U-H__I0rZ7v2xsmNCkHhI",
      authDomain: "agrajay-agam-classes.firebaseapp.com",
      databaseURL: "https://agrajay-agam-classes-default-rtdb.firebaseio.com",
      projectId: "agrajay-agam-classes",
      storageBucket: "agrajay-agam-classes.firebasestorage.app",
      messagingSenderId: "205657019628",
      appId: "1:205657019628:web:fb83a3b728b351d62a81c9"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    let isUserAdmin = false;
    let selectedCategory = 'All';
    let allArticlesData = null;

    // Check Admin Access via URL query (?admin=true)
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('admin') === 'true') openAdmin();

    // Keyboard shortcut for PC (Ctrl+Shift+A)
    document.addEventListener('keydown', function(e) {
        if (e.ctrlKey && e.shiftKey && e.key === 'A') openAdmin();
    });

    // Mobile Secret Shortcut: Tap Header 3 times quickly
    let tapCount = 0;
    let tapTimer;
    document.getElementById('siteHeading').addEventListener('click', function() {
        tapCount++;
        clearTimeout(tapTimer);
        if (tapCount === 3) {
            openAdmin();
            tapCount = 0;
        } else {
            tapTimer = setTimeout(() => { tapCount = 0; }, 1000);
        }
    });

    function openAdmin() {
        let pin = prompt("Enter Admin PIN:");
        if (pin === "1234") {
            isUserAdmin = true;
            document.getElementById('adminPanel').style.display = 'block';
            document.querySelectorAll('.admin-controls').forEach(el => el.style.display = 'flex');
        } else if (pin) {
            alert("Incorrect PIN!");
        }
    }

    // Publish or Update Article
    function postArticle() {
        const title = document.getElementById('title').value;
        const category = document.getElementById('category').value;
        const content = document.getElementById('content').value;
        const editId = document.getElementById('editArticleId').value;

        if (title && content) {
            if (editId) {
                database.ref('articles/' + editId).update({
                    title: title,
                    category: category,
                    content: content
                }, (error) => {
                    if (error) alert("Error: " + error.message);
                    else {
                        alert("Article updated successfully!");
                        resetForm();
                    }
                });
            } else {
                const newRef = database.ref('articles').push();
                newRef.set({
                    title: title,
                    category: category,
                    content: content,
                    likes: 0,
                    date: new Date().toLocaleDateString()
                }, (error) => {
                    if (error) alert("Error: " + error.message);
                    else {
                        alert("Published successfully!");
                        resetForm();
                    }
                });
            }
        } else {
            alert("Please fill in both title and content!");
        }
    }

    function resetForm() {
        document.getElementById('editArticleId').value = '';
        document.getElementById('title').value = '';
        document.getElementById('content').value = '';
        document.getElementById('panelTitle').innerText = 'Admin Panel - Post New Content';
        document.getElementById('submitBtn').innerText = 'Publish Content';
    }

    function editArticle(id, title, category, content) {
        document.getElementById('editArticleId').value = id;
        document.getElementById('title').value = title;
        document.getElementById('category').value = category;
        document.getElementById('content').value = content;
        
        document.getElementById('panelTitle').innerText = 'Edit Article';
        document.getElementById('submitBtn').innerText = 'Update Content';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function deleteArticle(id) {
        if (confirm("Are you sure you want to delete this article?")) {
            database.ref('articles/' + id).remove();
        }
    }

    function likeArticle(id, currentLikes) {
        database.ref('articles/' + id).update({
            likes: (currentLikes || 0) + 1
        });
    }

    function addComment(id) {
        const input = document.getElementById(`comment-input-${id}`);
        const text = input.value.trim();
        if (text) {
            database.ref(`articles/${id}/comments`).push({
                text: text,
                date: new Date().toLocaleDateString()
            });
            input.value = '';
        }
    }

    function shareArticle(title, id) {
        const shareUrl = window.location.href.split('?')[0] + '#' + id;
        if (navigator.share) {
            navigator.share({
                title: title,
                text: 'Read this post on Agrajay Agam Classes: ' + title,
                url: shareUrl
            }).catch(() => {});
        } else {
            navigator.clipboard.writeText(shareUrl);
            alert("Article link copied to clipboard!");
        }
    }

    // Filter Category Menu
    function filterArticles(category, btn) {
        selectedCategory = category;
        document.querySelectorAll('.menu-btn').forEach(b => b.classList.remove('active'));
        if (btn) btn.classList.add('active');
        document.getElementById('sectionHeading').innerText = category === 'All' ? 'Latest Content' : category;
        renderArticles();
    }

    // Follow System
    let isFollowing = localStorage.getItem('isFollowing') === 'true';
    
    database.ref('followersCount').on('value', (snapshot) => {
        const count = snapshot.val() || 0;
        document.getElementById('followerCount').innerText = count;
    });

    function updateFollowUI() {
        if (isFollowing) {
            document.getElementById('followText').innerText = 'Following';
            document.getElementById('followIcon').innerText = '✔';
        } else {
            document.getElementById('followText').innerText = 'Follow';
            document.getElementById('followIcon').innerText = '➕';
        }
    }
    updateFollowUI();

    function toggleFollow() {
        isFollowing = !isFollowing;
        localStorage.setItem('isFollowing', isFollowing);
        updateFollowUI();

        database.ref('followersCount').transaction((currentCount) => {
            return isFollowing ? (currentCount || 0) + 1 : Math.max((currentCount || 1) - 1, 0);
        });
    }

    // Fetch and Display Content
    database.ref('articles').on('value', (snapshot) => {
        allArticlesData = snapshot.val();
        renderArticles();
    });

    function renderArticles() {
        const articlesDiv = document.getElementById('articles');
        articlesDiv.innerHTML = '';

        if (allArticlesData) {
            let keys = Object.keys(allArticlesData).reverse();
            let count = 0;

            keys.forEach(key => {
                const item = allArticlesData[key];

                if (selectedCategory !== 'All' && item.category !== selectedCategory) {
                    return;
                }
                count++;

                let commentsHTML = '';
                if (item.comments) {
                    Object.keys(item.comments).forEach(cKey => {
                        commentsHTML += `<div class="comment-item">💬 ${item.comments[cKey].text}</div>`;
                    });
                } else {
                    commentsHTML = '<div class="comment-item" style="color:#888;">No comments yet. Be the first to comment!</div>';
                }

                const safeTitle = item.title.replace(/'/g, "\\'");
                const safeContent = item.content.replace(/'/g, "\\'").replace(/\n/g, '\\n');

                const articleEl = document.createElement('div');
                articleEl.className = 'article';
                articleEl.id = key;
                articleEl.innerHTML = `
                    <span class="category-badge">${item.category || 'General'}</span>
                    <h3>${item.title}</h3>
                    <div class="article-date">Published on: ${item.date}</div>
                    <div class="article-content">${item.content}</div>
                    
                    <div class="admin-controls" style="display: ${isUserAdmin ? 'flex' : 'none'};">
                        <button class="btn-edit" onclick="editArticle('${key}', '${safeTitle}', '${item.category}', '${safeContent}')">✏️ Edit</button>
                        <button class="btn-delete" onclick="deleteArticle('${key}')">🗑️ Delete</button>
                    </div>

                    <div class="interaction-box">
                        <div class="action-bar">
                            <button class="action-btn" onclick="likeArticle('${key}', ${item.likes || 0})">
                                👍 Like (${item.likes || 0})
                            </button>
                            <button class="action-btn" onclick="shareArticle('${safeTitle}', '${key}')">
                                🔗 Share
                            </button>
                        </div>
                        
                        <div class="comments-section">
                            <strong style="color: var(--dark-text);">Comments:</strong>
                            <div id="comments-list-${key}" style="margin-top: 8px;">${commentsHTML}</div>
                            <div class="comment-input-group">
                                <input type="text" id="comment-input-${key}" placeholder="Write a comment...">
                                <button class="btn-green" onclick="addComment('${key}')">Send</button>
                            </div>
                        </div>
                    </div>
                `;
                articlesDiv.appendChild(articleEl);
            });

                       if (count === 0) {
                articlesDiv.innerHTML = '<p style="color:#666;">No posts in this category yet.</p>';
            }
        } else {
            articlesDiv.innerHTML = '<p>No content posted yet.</p>';
        }
    }
</script>

</body>
</html>
